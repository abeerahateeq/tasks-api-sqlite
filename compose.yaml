services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      # "db" is the service name below, not localhost
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  taskdata:
